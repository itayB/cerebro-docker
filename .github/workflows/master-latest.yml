name: Docker Image Build

on:
  workflow_dispatch:
    inputs:
      cerebro_version:
        description: Cerebro version to build
        default: 0.9.4

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/itayb/cerebro
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cerebro
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.cerebro_version }}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CEREBRO_VERSION=${{ github.event.inputs.cerebro_version }}
          # Tag :0.9.4 and :latest
          tags: ${{ steps.meta.outputs.tags }}
